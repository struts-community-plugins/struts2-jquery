# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: Java CI with Maven

on:
  push:
    branches:
      - master
      - release/6.0.x
  pull_request:
    branches:
      - master
      - release/6.0.x

permissions: write-all

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4.2.2
    - name: Setup Chrome and ChromeDriver
      uses: browser-actions/setup-chrome@v1
      with:
        chrome-version: stable
        install-chromedriver: true
    - name: Set up cache
      uses: actions/cache@v4.2.3
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-
    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        java-version: 17
        distribution: temurin
        cache: maven
        server-id: struts2-jquery.snapshots
        server-username: MAVEN_USERNAME
        server-password: MAVEN_PASSWORD
    - name: Print Java version
      run: java -version
    - name: Print Maven version
      run: mvn -version
    - name: Print Chrome version
      run: google-chrome --version
    - name: Print ChromeDriver version
      run: chromedriver --version
    - name: Print OS details
      run: uname -a
    - name: Test outbound access
      run: curl -I https://code.jquery.com/jquery-3.7.1.min.js
    - name: Build & Install Main Plugin First
      run: |
        echo "🔨 Building and installing main plugin first..."
        mvn -B -V -DskipTests -DskipITs -pl struts2-jquery-plugin clean install
        
        echo "📦 Verify main plugin installation..."
        PLUGIN_JAR=$(find ~/.m2/repository -name "struts2-jquery-plugin-*.jar" | head -1)
        if [ -n "$PLUGIN_JAR" ]; then
          echo "✅ Plugin JAR found: $PLUGIN_JAR"
          echo "📊 JAR size: $(stat -c%s "$PLUGIN_JAR") bytes"
        
          # Verify static resources in installed JAR
          echo "🔍 Static resources in installed JAR:"
          jar -tf "$PLUGIN_JAR" | grep "^static/" | head -10
        else
          echo "❌ Plugin JAR not found in repository!"
          exit 1
        fi

    - name: Build Remaining Modules
      run: |
        echo "🔨 Building remaining modules..."
        mvn -B -V -DskipITs clean install
    - name: Debug Struts2 Static Resource Serving
      run: |
        echo "🔍 Debugging Struts2's built-in static resource serving mechanism..."
        
        cd struts2-jquery-integration-tests
        
        # Step 1: Check Struts2 static serving configuration
        echo "📋 Step 1: Checking Struts2 static serving configuration..."
        
        echo "Current struts.xml:"
        if [ -f src/main/resources/struts.xml ]; then
        cat src/main/resources/struts.xml
        else
        echo "❌ No struts.xml found"
        fi
        
        echo ""
        echo "Current struts.properties:"
        if [ -f src/main/resources/struts.properties ]; then
        cat src/main/resources/struts.properties
        else
        echo "ℹ️  No struts.properties found (using defaults)"
        fi
        
        # Step 2: Test Struts2 static resource mechanism directly
        echo ""
        echo "🚀 Step 2: Testing Struts2 static resource mechanism..."
        
        # Clean up processes
        pkill -f chrome || true
        pkill -f chromedriver || true
        
        # Start Jetty
        echo "Starting Jetty..."
        mvn jetty:run \
        -Djetty.scan=0 \
        -Dorg.eclipse.jetty.LEVEL=DEBUG \
        -Dorg.eclipse.jetty.server.LEVEL=DEBUG \
        -Dorg.eclipse.jetty.servlet.LEVEL=DEBUG \
        -Dorg.eclipse.jetty.webapp.LEVEL=DEBUG \
        -Djava.util.logging.config.file=src/test/resources/jetty-logging.properties \
        > jetty-detailed.log 2>&1 &
        JETTY_PID=$!
        
        # Wait for startup
        echo "⏳ Waiting for Jetty startup..."
        for i in {1..30}; do
        if curl -s -o /dev/null http://localhost:8080; then
         echo "✅ Jetty started after ${i} seconds"
         break
        elif [ $i -eq 30 ]; then
         echo "❌ Jetty failed to start"
         cat jetty.log
         kill $JETTY_PID 2>/dev/null || true
         exit 1
        else
         sleep 1
        fi
        done
        
        # Step 3: Test Struts2 static resource URLs directly
        echo ""
        echo "🔍 Step 3: Testing Struts2 static resource URLs..."
        
        # Test the specific failing URLs from the console logs
        STATIC_URLS=(
        "/static/js/struts2/jquery.struts2.min.js?s2j=6.0.2-SNAPSHOT"
        "/static/js/plugins/jquery.subscribe.min.js?s2j=6.0.2-SNAPSHOT"
        "/static/js/base/version.min.js"
        "/static/js/plugins/jquery.form.min.js?s2j=6.0.2-SNAPSHOT"
        )
        
        for url in "${STATIC_URLS[@]}"; do
        echo ""
        echo "Testing: http://localhost:8080$url"

        # Get detailed response
        RESPONSE=$(curl -s -w "HTTP:%{http_code};SIZE:%{size_download};TIME:%{time_total}" "http://localhost:8080$url")
        HTTP_CODE=$(echo "$RESPONSE" | grep -o "HTTP:[0-9]*" | cut -d: -f2)
        SIZE=$(echo "$RESPONSE" | grep -o "SIZE:[0-9]*" | cut -d: -f2)
        TIME=$(echo "$RESPONSE" | grep -o "TIME:[0-9.]*" | cut -d: -f2)
        CONTENT=$(echo "$RESPONSE" | sed 's/HTTP:.*$//')

        echo "  HTTP: $HTTP_CODE | Size: $SIZE bytes | Time: ${TIME}s"

        if [ "$HTTP_CODE" = "200" ]; then
         echo "  ✅ SUCCESS"
         if [ "$SIZE" -gt 100 ]; then
           echo "  Content preview: $(echo "$CONTENT" | head -c 80)..."
         else
           echo "  ⚠️  Very small response: $CONTENT"
         fi
        else
         echo "  ❌ FAILED"
         echo "  Response body: $(echo "$CONTENT" | head -c 200)"
        
         # Get headers for more info
         echo "  Response headers:"
         curl -s -I "http://localhost:8080$url" | head -5
        fi
        done
        
        # Step 4: Check what Struts2 is actually doing
        echo ""
        echo "🔍 Step 4: Analyzing Struts2 behavior..."
        
        # Test a working Struts2 action for comparison
        echo "Testing a working Struts2 action page:"
        WORKING_PAGE_URL="/regular/div/ajax-div.action"
        if [ -n "$WORKING_PAGE_URL" ]; then
        echo "Found working action: $WORKING_PAGE_URL"
        WORKING_HTTP=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:8080$WORKING_PAGE_URL")
        echo "  Working action HTTP: $WORKING_HTTP"

        if [ "$WORKING_HTTP" = "200" ]; then
         echo "  ✅ Struts2 actions are working"
        
         # Check what static resources this page tries to load
         WORKING_PAGE_CONTENT=$(curl -s "http://localhost:8080$WORKING_PAGE_URL")
         echo "  Static resources referenced by working page:"
         echo "$WORKING_PAGE_CONTENT" | grep -o 'src="[^"]*static[^"]*"' | head -5
        fi
        else
        echo "No working action URLs found"
        fi
        
        # Step 5: Check Struts2 logs for static resource handling
        echo ""
        echo "🔍 Step 5: Checking Struts2 logs for static resource handling..."
        
        echo "Recent Jetty/Struts2 log entries:"
        tail -30 jetty.log | grep -iE "(static|resource|404|struts)" || echo "No relevant log entries"
        
        # Step 6: Test Struts2 constants and configuration
        echo ""
        echo "🔍 Step 6: Testing Struts2 static serving configuration..."
        
        # Check if we can access Struts2 configuration information
        echo "Testing Struts2 configuration page (if available):"
        CONFIG_HTTP=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:8080/config-browser/index.action")
        echo "  Config browser HTTP: $CONFIG_HTTP"
        
        # Step 7: Check plugin JAR for correct static resource structure
        echo ""
        echo "🔍 Step 7: Checking plugin JAR static resource structure for Struts2..."
        
        PLUGIN_JAR=$(find ~/.m2/repository -name "struts2-jquery-plugin-*.jar" | head -1)
        echo "Plugin JAR: $PLUGIN_JAR"
        
        echo "Static resource paths in JAR (Struts2 expects specific structure):"
        jar -tf "$PLUGIN_JAR" | grep -E "(static/|template/|META-INF/resources/)" | head -15
        
        echo ""
        echo "Looking for META-INF/struts-plugin.xml:"
        jar -tf "$PLUGIN_JAR" | grep "struts-plugin.xml" || echo "❌ No struts-plugin.xml found"
        
        if jar -tf "$PLUGIN_JAR" | grep -q "struts-plugin.xml"; then
        echo "struts-plugin.xml content:"
        jar -xf "$PLUGIN_JAR" META-INF/struts-plugin.xml && cat META-INF/struts-plugin.xml && rm META-INF/struts-plugin.xml
        fi
        
        # Step 8: Compare local vs CI Struts2 behavior
        echo ""
        echo "🔍 Step 8: Environment-specific Struts2 analysis..."
        
        echo "Java classpath that includes the plugin:"
        mvn dependency:build-classpath | tr ':' '\n' | grep struts2-jquery
        
        echo ""
        echo "Struts2 version in use:"
        mvn dependency:tree | grep "org.apache.struts:struts2-core" | head -1
        
        echo ""
        echo "Environment variables that might affect Struts2:"
        env | grep -iE "(struts|java|class)" || echo "No relevant environment variables"
    
    
        # Step 9: Analyze the request flow from logs
        echo ""
        echo "📋 Step 9: Analyzing request flow from Jetty debug logs..."
        
        echo "=== REQUEST FLOW ANALYSIS ==="
        echo ""
        
        echo "🔍 Filter mapping and initialization:"
        grep -i "filter.*mapping\|filter.*init\|struts.*filter" jetty-detailed.log | head -100 || echo "  No filter mapping logs found"
        
        echo ""
        echo "🔍 Servlet mapping and initialization:"
        grep -i "servlet.*mapping\|servlet.*init\|default.*servlet" jetty-detailed.log | head -100 || echo "  No servlet mapping logs found"
        
        echo ""
        echo "🔍 Request handling for /regular/div/ajax-div.action (working):"
        grep -A 5 -B 5 "ajax-div.action" jetty-detailed.log | head -20 || echo "  No action request logs found"
        
        echo ""
        echo "🔍 Request handling for /static/js/base/version.min.js (failing):"
        grep -A 5 -B 5 "version.min.js\|static/js" jetty-detailed.log | head -20 || echo "  No static request logs found"
        
        echo ""
        echo "🔍 Any 404 handling:"
        grep -i "404\|not found" jetty-detailed.log | head -50 || echo "  No 404 logs found"
        
        echo ""
        echo "🔍 Context and webapp information:"
        grep -i "context\|webapp\|resource.*base" jetty-detailed.log | head -100 || echo "  No context logs found"
        

        # Cleanup
        kill $JETTY_PID 2>/dev/null || true
        pkill -f jetty || true
        
        echo ""
        echo "🎯 Analysis complete. Focus: Why isn't Struts2 serving static resources from plugin JAR in CI?"
    - name: Debug Classpath Before Integration Tests
      run: |
        echo "🔍 Debug classpath and dependencies before integration tests..."
        
        cd struts2-jquery-integration-tests
        
        # Show resolved dependencies
        echo "📋 Resolved dependencies:"
        mvn dependency:list | grep struts2-jquery
        
        # Show dependency tree
        echo ""
        echo "🌳 Dependency tree:"
        mvn dependency:tree | grep -A5 -B5 struts2-jquery
        
        # Check if plugin is in test classpath
        echo ""
        echo "🛤️ Test classpath:"
        mvn dependency:build-classpath | grep struts2-jquery || echo "❌ Plugin not in classpath!"
        
        # Verify the specific JAR that will be used
        echo ""
        echo "📦 Plugin JAR that will be used:"
        find ~/.m2/repository -name "struts2-jquery-plugin-*.jar" -exec ls -la {} \;

    - name: Run Integration Tests
      run: |
        echo "🧪 Running integration tests with command line flags..."
        
        # Check current configuration
        echo "📋 Current web.xml:"
        if [ -f src/main/webapp/WEB-INF/web.xml ]; then
        cat src/main/webapp/WEB-INF/web.xml
        else
        echo "❌ No web.xml found!"
        fi
        
        echo ""
        echo "📋 Jetty Maven plugin config:"
        grep -A 15 -B 5 "jetty-maven-plugin" pom.xml || echo "No jetty plugin config found"

        
        # Clean up Chrome processes
        pkill -f chrome || true
        pkill -f chromedriver || true
        
        mvn -pl struts2-jquery-integration-tests \
        -Dmaven.javadoc.skip=true \
        -Dmaven.source.skip=true \
        -Djetty.scan=0 \
        -Djava.util.logging.config.file=src/test/resources/jetty-logging.properties \
        -P ci-chrome \
        -Dfailsafe.webdriver.name=ChromeDriver \
        verify || {
        
          echo "❌ Integration tests failed"
        
          # Enhanced diagnostics
          echo "🔍 Maven execution diagnostics:"
        
          # Check what Maven actually tried to do
          echo "📋 Last Maven execution log:"
          # The error log should be in the output above
        
          # Check if Jetty started
          if curl -s -o /dev/null http://localhost:8080; then
            echo "✅ Jetty is running"
            echo "🔍 Testing static resources:"
            for file in "/static/js/base/version.min.js" "/static/js/plugins/jquery.subscribe.min.js"; do
              HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:8080$file")
              echo "  $file: HTTP $HTTP_CODE"
            done
          else
            echo "❌ Jetty is not running"
          fi
        
          # Clean up and exit
          pkill -f jetty || true
          pkill -f chrome || true
          exit 1
        }
        
        echo "✅ Integration tests completed successfully!"
        pkill -f chrome || true
    - name: Deploy SNAPSHOT
      if: github.ref == 'refs/heads/release/5.0.x' || github.ref == 'refs/heads/release/6.0.x'
      env:
        MAVEN_USERNAME: ${{ secrets.OSSRH_USERNAME }}
        MAVEN_PASSWORD: ${{ secrets.OSSRH_TOKEN }}
      run: mvn -B -V -DskipTests=true deploy
