# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: Java CI with Maven

on:
  push:
    branches:
      - master
      - release/6.0.x
  pull_request:
    branches:
      - master
      - release/6.0.x

permissions: write-all

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4.2.2
    - name: Install Chrome
      run: sudo apt-get update && sudo apt-get install -y google-chrome-stable
    - name: Set up cache
      uses: actions/cache@v4.2.3
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-
    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        java-version: 17
        distribution: temurin
        cache: maven
        server-id: struts2-jquery.snapshots
        server-username: MAVEN_USERNAME
        server-password: MAVEN_PASSWORD
    - name: Print Java version
      run: java -version
    - name: Print Maven version
      run: mvn -version
    - name: Print Chrome version
      run: google-chrome --version
    - name: Print ChromeDriver version
      run: chromedriver --version
    - name: Print OS details
      run: uname -a
    - name: Test outbound access
      run: curl -I https://code.jquery.com/jquery-3.7.1.min.js
    - name: Build & Install
      run: mvn -B -V -DskipITs install
    - name: Verify jQuery files in JAR
      run: |
        echo "🔍 Checking for jQuery files in struts2-jquery-plugin JAR..."
        
        # Find the built JAR file
        JAR_FILE=$(find . -name "struts2-jquery-plugin-*.jar" -not -path "*/target/dependency/*" | head -1)
        
        if [ -z "$JAR_FILE" ]; then
          echo "❌ struts2-jquery-plugin JAR not found!"
          exit 1
        fi
        
        echo "📦 Found JAR: $JAR_FILE"
        
        # Check for jQuery files
        echo "🔍 Checking for jQuery files..."
        JQUERY_FILES=$(jar -tf "$JAR_FILE" | grep -E "(jquery|jQuery)" | head -10)
        
        if [ -z "$JQUERY_FILES" ]; then
          echo "❌ No jQuery files found in JAR!"
          echo "📋 Full JAR contents:"
          jar -tf "$JAR_FILE" | grep -E "\.(js|css)$" | head -20
          exit 1
        else
          echo "✅ Found jQuery files:"
          echo "$JQUERY_FILES"
        fi
        
        # Specifically check for core jQuery file
        JQUERY_CORE=$(jar -tf "$JAR_FILE" | grep -E "jquery.*\.js$" | grep -v "struts")
        if [ -n "$JQUERY_CORE" ]; then
          echo "✅ Found core jQuery file: $JQUERY_CORE"
        else
          echo "⚠️  Core jQuery file not found, checking template directory..."
          jar -tf "$JAR_FILE" | grep -E "template.*jquery.*\.js$" || echo "❌ No jQuery found in template directory either"
        fi
        
        # Check for struts2-jquery specific files
        STRUTS_JQUERY=$(jar -tf "$JAR_FILE" | grep -E "jquery\.struts2.*\.js$")
        if [ -n "$STRUTS_JQUERY" ]; then
          echo "✅ Found struts2-jquery integration file: $STRUTS_JQUERY"
        else
          echo "❌ struts2-jquery integration file not found!"
        fi
    - name: Verify IT
      run: mvn -DskipMinify=false --projects struts2-jquery-integration-tests -Dmaven.javadoc.skip=true -P ci-chrome -Dfailsafe.webdriver.name=ChromeDriver -Djetty.tmpdir=$PWD/tmp verify -e
    - name: Deploy SNAPSHOT
      if: github.ref == 'refs/heads/release/5.0.x' || github.ref == 'refs/heads/release/6.0.x'
      env:
        MAVEN_USERNAME: ${{ secrets.OSSRH_USERNAME }}
        MAVEN_PASSWORD: ${{ secrets.OSSRH_TOKEN }}
      run: mvn -B -V -DskipTests=true deploy
