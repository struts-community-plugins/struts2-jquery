# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: Java CI with Maven

on:
  push:
    branches:
      - master
      - release/6.0.x
  pull_request:
    branches:
      - master
      - release/6.0.x

permissions: write-all

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4.2.2
    - name: Setup Chrome and ChromeDriver
      uses: browser-actions/setup-chrome@v1
      with:
        chrome-version: stable
        install-chromedriver: true
    - name: Set up cache
      uses: actions/cache@v4.2.3
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-
    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        java-version: 17
        distribution: temurin
        cache: maven
        server-id: struts2-jquery.snapshots
        server-username: MAVEN_USERNAME
        server-password: MAVEN_PASSWORD
    - name: Print Java version
      run: java -version
    - name: Print Maven version
      run: mvn -version
    - name: Print Chrome version
      run: google-chrome --version
    - name: Print ChromeDriver version
      run: chromedriver --version
    - name: Print OS details
      run: uname -a
    - name: Test outbound access
      run: curl -I https://code.jquery.com/jquery-3.7.1.min.js
    - name: Build & Install Main Plugin First
      run: |
        echo "🔨 Building and installing main plugin first..."
        mvn -B -V -DskipTests -DskipITs -pl struts2-jquery-plugin clean install
        
        echo "📦 Verify main plugin installation..."
        PLUGIN_JAR=$(find ~/.m2/repository -name "struts2-jquery-plugin-*.jar" | head -1)
        if [ -n "$PLUGIN_JAR" ]; then
          echo "✅ Plugin JAR found: $PLUGIN_JAR"
          echo "📊 JAR size: $(stat -c%s "$PLUGIN_JAR") bytes"
        
          # Verify static resources in installed JAR
          echo "🔍 Static resources in installed JAR:"
          jar -tf "$PLUGIN_JAR" | grep "^static/" | head -10
        else
          echo "❌ Plugin JAR not found in repository!"
          exit 1
        fi

    - name: Build Remaining Modules
      run: |
        echo "🔨 Building remaining modules..."
        mvn -B -V -DskipITs clean install

    - name: Debug Classpath Before Integration Tests
      run: |
        echo "🔍 Debug classpath and dependencies before integration tests..."
        
        cd struts2-jquery-integration-tests
        
        # Show resolved dependencies
        echo "📋 Resolved dependencies:"
        mvn dependency:list | grep struts2-jquery
        
        # Show dependency tree
        echo ""
        echo "🌳 Dependency tree:"
        mvn dependency:tree | grep -A5 -B5 struts2-jquery
        
        # Check if plugin is in test classpath
        echo ""
        echo "🛤️ Test classpath:"
        mvn dependency:build-classpath | grep struts2-jquery || echo "❌ Plugin not in classpath!"
        
        # Verify the specific JAR that will be used
        echo ""
        echo "📦 Plugin JAR that will be used:"
        find ~/.m2/repository -name "struts2-jquery-plugin-*.jar" -exec ls -la {} \;

    - name: Run Integration Tests
      run: |
        echo "🧪 Running integration tests with command line flags..."
        
        # Clean up Chrome processes
        pkill -f chrome || true
        pkill -f chromedriver || true
        
        mvn -pl struts2-jquery-integration-tests \
        -Dmaven.javadoc.skip=true \
        -Dmaven.source.skip=true \
        -P ci-chrome \
        -Dfailsafe.webdriver.name=ChromeDriver \
        verify || {
        
          echo "❌ Integration tests failed"
        
          # Enhanced diagnostics
          echo "🔍 Maven execution diagnostics:"
        
          # Check what Maven actually tried to do
          echo "📋 Last Maven execution log:"
          # The error log should be in the output above
        
          # Check if Jetty started
          if curl -s -o /dev/null http://localhost:8080; then
            echo "✅ Jetty is running"
            echo "🔍 Testing static resources:"
            for file in "/static/js/base/version.min.js" "/static/js/plugins/jquery.subscribe.min.js"; do
              HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:8080$file")
              echo "  $file: HTTP $HTTP_CODE"
            done
          else
            echo "❌ Jetty is not running"
          fi
        
          # Clean up and exit
          pkill -f jetty || true
          pkill -f chrome || true
          exit 1
        }
        
        echo "✅ Integration tests completed successfully!"
        pkill -f chrome || true
    - name: Deploy SNAPSHOT
      if: github.ref == 'refs/heads/release/5.0.x' || github.ref == 'refs/heads/release/6.0.x'
      env:
        MAVEN_USERNAME: ${{ secrets.OSSRH_USERNAME }}
        MAVEN_PASSWORD: ${{ secrets.OSSRH_TOKEN }}
      run: mvn -B -V -DskipTests=true deploy
