# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: Java CI with Maven

on:
  push:
    branches:
      - master
      - release/6.0.x
  pull_request:
    branches:
      - master
      - release/6.0.x

permissions: write-all

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4.2.2
    - name: Setup Chrome and ChromeDriver
      uses: browser-actions/setup-chrome@v1
      with:
        chrome-version: stable
        install-chromedriver: true
    - name: Set up cache
      uses: actions/cache@v4.2.3
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-
    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        java-version: 17
        distribution: temurin
        cache: maven
        server-id: struts2-jquery.snapshots
        server-username: MAVEN_USERNAME
        server-password: MAVEN_PASSWORD
    - name: Print Java version
      run: java -version
    - name: Print Maven version
      run: mvn -version
    - name: Print Chrome version
      run: google-chrome --version
    - name: Print ChromeDriver version
      run: chromedriver --version
    - name: Print OS details
      run: uname -a
    - name: Test outbound access
      run: curl -I https://code.jquery.com/jquery-3.7.1.min.js
    - name: Build & Install Main Plugin First
      run: |
        echo "🔨 Building and installing main plugin first..."
        mvn -B -V -DskipTests -DskipITs -pl struts2-jquery-plugin clean install
        
        echo "📦 Verify main plugin installation..."
        PLUGIN_JAR=$(find ~/.m2/repository -name "struts2-jquery-plugin-*.jar" | head -1)
        if [ -n "$PLUGIN_JAR" ]; then
          echo "✅ Plugin JAR found: $PLUGIN_JAR"
          echo "📊 JAR size: $(stat -c%s "$PLUGIN_JAR") bytes"
        
          # Verify static resources in installed JAR
          echo "🔍 Static resources in installed JAR:"
          jar -tf "$PLUGIN_JAR" | grep "^static/" | head -10
        else
          echo "❌ Plugin JAR not found in repository!"
          exit 1
        fi

    - name: Build Remaining Modules
      run: |
        echo "🔨 Building remaining modules..."
        mvn -B -V -DskipITs clean install

    - name: Debug Classpath Before Integration Tests
      run: |
        echo "🔍 Debug classpath and dependencies before integration tests..."
        
        cd struts2-jquery-integration-tests
        
        # Show resolved dependencies
        echo "📋 Resolved dependencies:"
        mvn dependency:list | grep struts2-jquery
        
        # Show dependency tree
        echo ""
        echo "🌳 Dependency tree:"
        mvn dependency:tree | grep -A5 -B5 struts2-jquery
        
        # Check if plugin is in test classpath
        echo ""
        echo "🛤️ Test classpath:"
        mvn dependency:build-classpath | grep struts2-jquery || echo "❌ Plugin not in classpath!"
        
        # Verify the specific JAR that will be used
        echo ""
        echo "📦 Plugin JAR that will be used:"
        find ~/.m2/repository -name "struts2-jquery-plugin-*.jar" -exec ls -la {} \;

    - name: Start Jetty with Debug Info
      run: |
        echo "🚀 Starting Jetty with enhanced debugging..."
        cd struts2-jquery-integration-tests
        
        # Set Maven debug mode
        export MAVEN_OPTS="-Xdebug -Dorg.eclipse.jetty.LEVEL=DEBUG"
        
        # Start Jetty in background with verbose output
        mvn jetty:start -X > jetty-start.log 2>&1 &
        JETTY_PID=$!
        
        # Wait for startup and show logs
        echo "⏳ Waiting for Jetty startup..."
        for i in {1..60}; do
          if curl -s -o /dev/null -w "%{http_code}" http://localhost:8080 | grep -q "200\|404"; then
            echo "✅ Jetty started successfully"
            break
          else
            if [ $i -eq 30 ]; then
              echo "📄 Jetty startup log (first 100 lines):"
              head -100 jetty-start.log
            fi
            echo "  Waiting... (attempt $i/60)"
            sleep 2
          fi
        done
        
        # Show final startup log
        echo ""
        echo "📄 Jetty startup log (last 50 lines):"
        tail -50 jetty-start.log
        
        # Test static resources immediately
        echo ""
        echo "🔍 Testing static resources after startup..."
        
        STATIC_FILES=(
          "/static/js/base/version.min.js"
          "/static/js/plugins/jquery.subscribe.min.js"
          "/static/js/struts2/jquery.struts2.min.js"
        )
        
        for file in "${STATIC_FILES[@]}"; do
          echo "Testing: http://localhost:8080$file"
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:8080$file")
          echo "  Result: HTTP $HTTP_CODE"
        
          if [ "$HTTP_CODE" != "200" ]; then
            # Get detailed response
            echo "  📄 Detailed response:"
            curl -v "http://localhost:8080$file" 2>&1 | head -20
          fi
        done

    - name: Verify IT (With Static Resource Debugging)
      run: |
        echo "🧪 Running integration tests with static resource debugging..."
        
        # Ensure Jetty is still running
        if ! curl -s -o /dev/null http://localhost:8080; then
          echo "❌ Jetty is not running, restarting..."
          cd struts2-jquery-integration-tests
          mvn jetty:start &
          sleep 30
        fi
        
        # Run tests with enhanced logging
        mvn -DskipMinify=false \
            --projects struts2-jquery-integration-tests \
            -Dmaven.javadoc.skip=true \
            -P ci-chrome \
            -Dfailsafe.webdriver.name=ChromeDriver \
            -Dmaven.failsafe.forkCount=1 \
            -Dmaven.failsafe.reuseForks=false \
            -Dmaven.failsafe.timeout=600 \
            -Djetty.tmpdir=$PWD/tmp \
            -Dwebdriver.chrome.verboseLogging=true \
            -X \
            verify || {
        
          echo "❌ Tests failed, gathering debug info..."
        
          # Check if Jetty is still running
          if curl -s -o /dev/null http://localhost:8080; then
            echo "✅ Jetty is still running"
        
            # Test static resources again
            echo "🔍 Testing static resources after test failure..."
            for file in "/static/js/base/version.min.js" "/static/js/plugins/jquery.subscribe.min.js"; do
              echo "Testing: http://localhost:8080$file"
              curl -I "http://localhost:8080$file" 2>&1 | head -10
            done
          else
            echo "❌ Jetty stopped running during tests"
          fi
        
          # Show Jetty logs
          echo "📄 Recent Jetty logs:"
          cd struts2-jquery-integration-tests
          if [ -f jetty-start.log ]; then
            tail -100 jetty-start.log
          fi
        
          # Clean up and exit
          pkill -f jetty || true
          pkill -f chrome || true
          exit 1
        }
        
        echo "✅ Integration tests completed successfully"
        
        # Clean up
        pkill -f jetty || true
        pkill -f chrome || true
    - name: Deploy SNAPSHOT
      if: github.ref == 'refs/heads/release/5.0.x' || github.ref == 'refs/heads/release/6.0.x'
      env:
        MAVEN_USERNAME: ${{ secrets.OSSRH_USERNAME }}
        MAVEN_PASSWORD: ${{ secrets.OSSRH_TOKEN }}
      run: mvn -B -V -DskipTests=true deploy
